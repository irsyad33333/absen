
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#061513">
<title>QR Scanner Absensi</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  padding: 14px;
  color: #f2fffc;
  font-family: Inter, system-ui, Arial, sans-serif;
  background:
    radial-gradient(circle at 10% 10%, rgba(20,184,166,.2), transparent 35%),
    radial-gradient(circle at 90% 90%, rgba(14,165,233,.13), transparent 35%),
    #061513;
}
.app {
  width: min(100%, 520px);
  min-height: calc(100vh - 28px);
  margin: auto;
  padding: 18px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 28px;
  background: rgba(255,255,255,.065);
  box-shadow: 0 30px 80px #0005;
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
}
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  gap: 10px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 45px; height: 45px;
  display: grid; place-items: center;
  border-radius: 15px;
  background: linear-gradient(145deg,#19c6b2,#0f766e);
  font-weight: 900;
}
.brand strong { display: block; font-size: 14px; }
.brand small { display: block; color: #91aaa5; font-size: 10px; margin-top: 4px; }
.online { color: #86efac; font-size: 10px; font-weight: 900; }
.camera-card {
  padding: 9px;
  border: 1px solid #ffffff18;
  border-radius: 21px;
  background: #0004;
  overflow: hidden;
}
#reader { width: 100%; min-height: 220px; }
#reader video { width: 100% !important; border-radius: 15px !important; object-fit: cover !important; }
#reader__dashboard { display: none !important; }
.controls { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 12px; }
select, button {
  min-height: 45px;
  border: 1px solid #ffffff20;
  border-radius: 12px;
  color: white;
  background: #ffffff10;
  font: inherit;
}
select { width: 100%; padding: 0 10px; }
select option { color: #111; background: white; }
button { padding: 0 14px; cursor: pointer; font-size: 11px; font-weight: 900; }
button.primary {
  width: 100%;
  margin-top: 12px;
  border: 0;
  background: linear-gradient(135deg,#19c6b2,#0f766e);
}
button:disabled { opacity: .5; cursor: not-allowed; }
.status {
  margin-top: 13px;
  padding: 14px;
  border-radius: 14px;
  color: #a9c0bc;
  background: #ffffff0b;
  font-size: 12px;
  line-height: 1.6;
  text-align: center;
  overflow-wrap: anywhere;
}
.status.success { color: #86efac; background: #22c55e15; }
.status.error { color: #fda4af; background: #f43f5e15; }
.tip {
  margin-top: 14px;
  color: #829e98;
  font-size: 10px;
  line-height: 1.7;
  text-align: center;
}
.result {
  display: none;
  margin-top: 13px;
  padding: 14px;
  border-radius: 14px;
  background: #14b8a61b;
  color: #a7fff0;
  text-align: center;
  font-size: 12px;
  line-height: 1.6;
}
.result.show { display: block; }
@media(max-width:420px) {
  body { padding: 8px; }
  .app { min-height: calc(100vh - 16px); padding: 12px; border-radius: 22px; }
  .controls { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<div class="app">

  <div class="top">
    <div class="brand">
      <div class="logo">QR</div>
      <div>
        <strong>QR ABSENSI</strong>
        <small>Scanner Kehadiran Siswa</small>
      </div>
    </div>
    <div class="online">● ONLINE</div>
  </div>

  <div class="camera-card">
    <div id="reader"></div>
  </div>

  <div class="controls">
    <select id="cameraSelect">
      <option value="">Kamera belum dipilih</option>
    </select>
    <button id="switchCamera" type="button">GANTI KAMERA</button>
  </div>

  <button id="startButton" class="primary" type="button">
    ▶ MULAI KAMERA
  </button>

  <div id="status" class="status">
    Tekan MULAI KAMERA untuk mengaktifkan scanner.
  </div>

  <div id="result" class="result"></div>

  <div class="tip">
    Arahkan kamera ke QR Code siswa.<br>
    QR Code harus berisi NISN yang terdaftar di database.
  </div>
</div>

<script>
'use strict';

const params = new URLSearchParams(location.search);
const returnOrigin = params.get('returnOrigin') || '';

let scanner = null;
let cameras = [];
let active = false;
let starting = false;
let sent = false;
let currentCameraId = '';

const $ = id => document.getElementById(id);

function setStatus(message, type) {
  $('status').textContent = message;
  $('status').className = 'status' + (type ? ' ' + type : '');
}

function cameraError(error) {
  const name = error && error.name ? error.name : '';
  const message = error && error.message ? error.message : '';

  if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
    return 'Izin kamera ditolak. Buka pengaturan situs Chrome, pilih Kamera, ubah menjadi Izinkan, kemudian muat ulang halaman.';
  }
  if (name === 'NotFoundError') return 'Kamera tidak ditemukan.';
  if (name === 'NotReadableError') return 'Kamera sedang digunakan aplikasi lain. Tutup aplikasi tersebut.';
  if (name === 'SecurityError') return 'Akses kamera diblokir. Pastikan halaman menggunakan HTTPS.';
  return message || 'Kamera gagal dibuka.';
}

async function requestPermission() {
  if (!window.isSecureContext) {
    throw new Error('Scanner harus dibuka melalui HTTPS.');
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error('Browser tidak mendukung akses kamera.');
  }

  // Dipanggil hanya setelah tombol ditekan oleh pengguna.
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' } },
    audio: false
  });

  stream.getTracks().forEach(track => track.stop());
}

async function loadCameras() {
  cameras = await Html5Qrcode.getCameras();
  if (!cameras || cameras.length === 0) {
    throw new Error('Tidak ada kamera yang ditemukan.');
  }

  const select = $('cameraSelect');
  select.innerHTML = '';

  cameras.forEach((camera, index) => {
    const option = document.createElement('option');
    option.value = camera.id;
    option.textContent = camera.label || ('Kamera ' + (index + 1));
    select.appendChild(option);
  });

  const rear = cameras.find(c =>
    /back|rear|environment|belakang/i.test(c.label || '')
  );

  currentCameraId = rear ? rear.id : cameras[0].id;
  select.value = currentCameraId;
}

async function startScanner(cameraId) {
  if (starting || active || sent) return;

  starting = true;
  $('startButton').disabled = true;
  $('startButton').textContent = 'MEMBUKA KAMERA...';
  setStatus('Meminta izin kamera...', '');

  try {
    if (typeof Html5Qrcode === 'undefined') {
      throw new Error('Library scanner gagal dimuat. Periksa internet.');
    }

    if (!cameraId) {
      await requestPermission();
      await loadCameras();
      cameraId = currentCameraId;
    }

    scanner = new Html5Qrcode('reader');

    const config = {
      fps: 12,
      qrbox: function(width, height) {
        const size = Math.min(Math.floor(Math.min(width, height) * .75), 280);
        return { width: size, height: size };
      },
      aspectRatio: 1
    };

    await scanner.start(
      cameraId,
      config,
      onScanSuccess,
      function() {}
    );

    active = true;
    currentCameraId = cameraId;
    $('startButton').textContent = 'KAMERA AKTIF';
    setStatus('Kamera aktif. Arahkan ke QR Code siswa.', 'success');

  } catch (error) {
    console.error('Camera error:', error);
    active = false;
    $('startButton').disabled = false;
    $('startButton').textContent = '▶ COBA LAGI';
    setStatus('GAGAL MEMBUKA KAMERA: ' + cameraError(error), 'error');

    if (scanner) {
      try { await scanner.clear(); } catch (e) {}
      scanner = null;
    }
  } finally {
    starting = false;
  }
}

async function stopScanner() {
  if (!scanner) return;

  try {
    if (active) await scanner.stop();
    await scanner.clear();
  } catch (error) {
    console.error(error);
  }

  scanner = null;
  active = false;
}

async function onScanSuccess(decodedText) {
  if (sent) return;

  const nisn = String(decodedText || '').trim();

  if (!nisn) return;

  // Validasi sederhana: isi QR harus berupa NISN, bukan URL.
  if (!/^\d+$/.test(nisn)) {
    setStatus('QR terbaca, tetapi isinya bukan NISN angka.', 'error');
    return;
  }

  if (!window.opener || window.opener.closed) {
    setStatus('Aplikasi utama tidak ditemukan. Buka scanner dari aplikasi absensi.', 'error');
    return;
  }

  if (!returnOrigin) {
    setStatus('Alamat aplikasi utama tidak ditemukan. Buka scanner melalui aplikasi absensi.', 'error');
    return;
  }

  sent = true;
  setStatus('QR berhasil dibaca. Mengirim ke aplikasi utama...', '');
  $('result').textContent = 'NISN terbaca: ' + nisn;
  $('result').classList.add('show');

  await stopScanner();

  try {
    window.opener.postMessage({
      type: 'QR_ATTENDANCE',
      studentId: nisn
    }, returnOrigin);

    setStatus('QR berhasil dikirim. Periksa hasil absensi pada aplikasi utama.', 'success');
    $('startButton').textContent = 'QR TERKIRIM';

    setTimeout(() => {
      try { window.close(); } catch (e) {}
    }, 1300);

  } catch (error) {
    sent = false;
    setStatus('Gagal mengirim hasil QR: ' + error.message, 'error');
    $('startButton').disabled = false;
    $('startButton').textContent = '▶ COBA LAGI';
  }
}

$('startButton').addEventListener('click', () => {
  startScanner('');
});

$('switchCamera').addEventListener('click', async () => {
  if (starting || sent) return;

  if (!cameras.length) {
    setStatus('Mulai kamera terlebih dahulu.', '');
    return;
  }

  if (cameras.length < 2) {
    setStatus('Hanya satu kamera tersedia.', '');
    return;
  }

  const index = cameras.findIndex(c => c.id === currentCameraId);
  const next = cameras[(index + 1) % cameras.length];

  await stopScanner();
  currentCameraId = next.id;
  await startScanner(next.id);
});

$('cameraSelect').addEventListener('change', async event => {
  if (starting || sent || !event.target.value) return;

  const selected = event.target.value;
  await stopScanner();
  currentCameraId = selected;
  await startScanner(selected);
});

window.addEventListener('pagehide', () => {
  if (scanner && active) scanner.stop().catch(() => {});
});

window.addEventListener('load', () => {
  if (!window.isSecureContext) {
    setStatus('Halaman scanner harus menggunakan HTTPS.', 'error');
    $('startButton').disabled = true;
    return;
  }

  if (!returnOrigin) {
    setStatus('Buka scanner dari tombol di aplikasi utama agar hasil scan dapat dikirim.', 'error');
  } else {
    setStatus('Siap digunakan. Tekan MULAI KAMERA.', '');
  }
});
</script>
</body>
</html>
