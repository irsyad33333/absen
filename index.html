
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner Absensi QR</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #17352c;
      background: #eef7f2;
    }
    .card {
      width: 100%;
      max-width: 480px;
      padding: 25px;
      border-radius: 22px;
      background: white;
      box-shadow: 0 12px 40px #174d3020;
      text-align: center;
    }
    h2 { margin-bottom: 8px; }
    p { color: #71877c; font-size: 13px; line-height: 1.6; }
    #reader {
      margin-top: 20px;
      overflow: hidden;
      border: 2px dashed #b9d8c7;
      border-radius: 15px;
    }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      background: #087f5b;
      color: white;
    }
    button.secondary { background: #e6f1eb; color: #087f5b; }
    button:disabled { opacity: .5; }
    #message {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    .success { color: #078354; }
    .error { color: #d44350; }
  </style>
</head>
<body>
  <main class="card">
    <h2>Scanner Absensi QR</h2>
    <p>Izinkan akses kamera, kemudian arahkan QR Code siswa ke kamera.</p>

    <div id="reader"></div>

    <button id="startButton" onclick="startCamera()">IZINKAN & MULAI KAMERA</button>
    <button class="secondary" onclick="stopCamera()">HENTIKAN KAMERA</button>

    <div id="message">Tekan tombol untuk memulai kamera.</div>
  </main>

  <script>
    let scanner = null;
    let running = false;
    let processing = false;

    const params = new URLSearchParams(location.search);
    const returnOrigin = params.get("returnOrigin");

    function message(text, type = "") {
      const el = document.getElementById("message");
      el.textContent = text;
      el.className = type;
    }

    async function startCamera() {
      if (running || !window.Html5Qrcode) return;

      if (!window.isSecureContext || !navigator.mediaDevices) {
        message("Kamera membutuhkan HTTPS dan browser yang mendukung akses kamera.", "error");
        return;
      }

      const button = document.getElementById("startButton");
      button.disabled = true;
      message("Meminta izin kamera...");

      try {
        scanner = new Html5Qrcode("reader");

        const config = {
          fps: 10,
          qrbox: { width: 240, height: 240 },
          aspectRatio: 1
        };

        try {
          await scanner.start(
            { facingMode: "environment" },
            config,
            onScan,
            () => {}
          );
        } catch (firstError) {
          const cameras = await Html5Qrcode.getCameras();
          if (!cameras || !cameras.length) throw firstError;

          await scanner.start(
            cameras[0].id,
            config,
            onScan,
            () => {}
          );
        }

        running = true;
        message("Kamera aktif. Silakan scan QR Code siswa.", "success");

      } catch (error) {
        console.error(error);
        let info = error.message || "Kamera tidak dapat dibuka.";

        if (error.name === "NotAllowedError" ||
            error.name === "PermissionDeniedError") {
          info = "Izin kamera ditolak. Izinkan kamera untuk GitHub Pages melalui pengaturan Chrome.";
        } else if (error.name === "NotFoundError") {
          info = "Kamera tidak ditemukan.";
        } else if (error.name === "NotReadableError") {
          info = "Kamera sedang digunakan aplikasi lain.";
        }

        message(info, "error");

        if (scanner) {
          try { await scanner.clear(); } catch (e) {}
        }
        scanner = null;
        running = false;
      } finally {
        button.disabled = false;
      }
    }

    async function stopCamera() {
      if (!scanner) return;

      try {
        if (running) await scanner.stop();
        await scanner.clear();
      } catch (error) {
        console.warn(error);
      }

      scanner = null;
      running = false;
      processing = false;
      message("Kamera dihentikan.");
    }

    function onScan(decodedText) {
      if (processing) return;

      const nisn = String(decodedText).trim();
      if (!nisn) return;

      processing = true;
      message("QR berhasil dibaca. Mengirim data absensi...");

      if (!window.opener || window.opener.closed) {
        message("Halaman aplikasi absensi tidak ditemukan. Buka scanner dari aplikasi absensi.", "error");
        processing = false;
        return;
      }

      window.opener.postMessage({
        type: "QR_ATTENDANCE",
        studentId: nisn
      }, returnOrigin || "*");

      message("QR terkirim. Silakan kembali ke aplikasi absensi.", "success");

      stopCamera();
    }

    window.addEventListener("beforeunload", () => {
      if (scanner && running) scanner.stop().catch(() => {});
    });
  </script>
</body>
</html>
