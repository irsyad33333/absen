
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner Absensi QR</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #edf5f1;
      color: #183b30;
      font-family: Arial, sans-serif;
    }

    .card {
      max-width: 600px;
      margin: 20px auto;
      padding: 24px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 10px 30px #123b2912;
      text-align: center;
    }

    #reader {
      width: 100%;
      min-height: 220px;
      margin: 18px auto;
      overflow: hidden;
      border-radius: 15px;
    }

    button, select {
      width: 100%;
      min-height: 48px;
      margin-top: 10px;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      font-size: 15px;
    }

    button {
      color: white;
      background: #087b61;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      color: #075744;
      background: #e5f3ed;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    select {
      border: 1px solid #dce8e2;
      background: white;
    }

    #message {
      min-height: 30px;
      margin-top: 15px;
      font-size: 13px;
      line-height: 1.5;
    }

    .hint { color: #80938a; font-size: 13px; }
  </style>
</head>

<body>
  <main class="card">
    <h2>Scanner Kehadiran QR</h2>
    <p class="hint">
      Arahkan kamera ke QR Code siswa. QR harus berisi NISN.
    </p>

    <select id="cameraSelect" disabled>
      <option value="">Kamera belum dipilih</option>
    </select>

    <div id="reader"></div>

    <button id="startButton" onclick="startCamera()">
      Mulai Kamera
    </button>

    <button id="stopButton" class="secondary"
      onclick="stopCamera()" disabled>
      Hentikan Kamera
    </button>

    <p id="message">
      Tekan Mulai Kamera untuk meminta izin kamera.
    </p>
  </main>

  <script>
    let scanner = null;
    let running = false;
    let processing = false;
    let cameras = [];

    const message = document.getElementById("message");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");
    const cameraSelect = document.getElementById("cameraSelect");

    const params = new URLSearchParams(location.search);
    const returnOrigin = params.get("returnOrigin") || "";

    function setMessage(text, error = false) {
      message.textContent = text;
      message.style.color = error ? "#c34d4d" : "#087b61";
    }

    function validReturnOrigin(origin) {
      try {
        const url = new URL(origin);

        return url.protocol === "https:" &&
          (
            url.hostname === "script.google.com" ||
            url.hostname.endsWith(".googleusercontent.com")
          );
      } catch (error) {
        return false;
      }
    }

    async function startCamera() {
      if (running) return;

      if (!window.isSecureContext ||
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        setMessage(
          "Kamera memerlukan browser yang mendukung HTTPS dan akses kamera.",
          true
        );
        return;
      }

      startButton.disabled = true;
      setMessage("Meminta izin kamera...");

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });

        stream.getTracks().forEach(track => track.stop());

        cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          throw new Error("Kamera tidak ditemukan.");
        }

        cameraSelect.innerHTML = "";

        cameras.forEach((camera, index) => {
          const option = document.createElement("option");
          option.value = camera.id;
          option.textContent =
            camera.label || ("Kamera " + (index + 1));
          cameraSelect.appendChild(option);
        });

        cameraSelect.disabled = false;

        const rear = cameras.find(camera =>
          /back|rear|environment|belakang/i.test(camera.label)
        );

        const selected = rear || cameras[0];
        cameraSelect.value = selected.id;

        await runScanner(selected.id);

      } catch (error) {
        startButton.disabled = false;

        let text = error.message || String(error);

        if (error.name === "NotAllowedError" ||
            error.name === "PermissionDeniedError") {
          text =
            "Izin kamera ditolak. Klik ikon pengaturan situs di samping alamat, ubah Kamera menjadi Izinkan, lalu muat ulang halaman.";
        } else if (error.name === "NotFoundError") {
          text = "Kamera tidak ditemukan pada perangkat.";
        } else if (error.name === "NotReadableError") {
          text =
            "Kamera sedang digunakan aplikasi lain. Tutup aplikasi kamera lain dan coba kembali.";
        }

        setMessage(text, true);
      }
    }

    async function runScanner(cameraId) {
      if (scanner && running) {
        await stopCamera();
      }

      scanner = new Html5Qrcode("reader");

      try {
        await scanner.start(
          cameraId,
          {
            fps: 10,
            qrbox: function(width, height) {
              const size = Math.floor(
                Math.min(width, height) * 0.72
              );
              return { width: size, height: size };
            },
            aspectRatio: 1
          },
          onScanSuccess,
          function() {}
        );

        running = true;
        startButton.disabled = true;
        stopButton.disabled = false;

        setMessage("Kamera aktif. Arahkan ke QR Code siswa.");

      } catch (error) {
        running = false;
        startButton.disabled = false;
        stopButton.disabled = true;

        setMessage(
          "Tidak dapat memulai kamera: " +
          (error.message || error),
          true
        );
      }
    }

    async function onScanSuccess(decodedText) {
      if (processing) return;

      const nisn = String(decodedText || "").trim();
      if (!nisn) return;

      processing = true;
      setMessage("QR terbaca. Mengirim data absensi...");

      await stopCamera();

      if (!window.opener || window.opener.closed) {
        setMessage(
          "Halaman aplikasi utama tidak ditemukan. Buka scanner dari aplikasi absensi.",
          true
        );
        processing = false;
        return;
      }

      if (!validReturnOrigin(returnOrigin)) {
        setMessage(
          "Alamat aplikasi utama tidak valid. Buka scanner dari aplikasi utama.",
          true
        );
        processing = false;
        return;
      }

      window.opener.postMessage(
        {
          type: "QR_ATTENDANCE",
          studentId: nisn
        },
        returnOrigin
      );

      setMessage(
        "QR berhasil dikirim. Periksa hasil absensi pada aplikasi utama."
      );

      setTimeout(() => {
        processing = false;
      }, 2500);
    }

    async function stopCamera() {
      if (scanner && running) {
        try {
          await scanner.stop();
          await scanner.clear();
        } catch (error) {
          console.warn(error);
        }
      }

      running = false;
      startButton.disabled = false;
      stopButton.disabled = true;
    }

    cameraSelect.addEventListener("change", async function() {
      const selected = cameraSelect.value;
      if (!selected) return;

      if (running) {
        await stopCamera();
      }

      await runScanner(selected);
    });

    window.addEventListener("beforeunload", function() {
      if (scanner && running) {
        scanner.stop().catch(() => {});
      }
    });
  </script>
</body>
</html>
