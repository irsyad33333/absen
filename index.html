
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Absensi QR</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }
    .container {
      max-width: 440px;
      margin: 25px auto;
      padding: 22px;
      background: #1c293b;
      border-radius: 22px;
      box-shadow: 0 10px 35px #0005;
    }
    h2 { text-align: center; margin-top: 5px; }
    .subtitle {
      text-align: center;
      color: #aab8ca;
      font-size: 13px;
      margin-bottom: 22px;
    }
    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 15px;
      background: #fff;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    button.stop { background: #dc3545; }
    button:disabled { opacity: .5; }
    #status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #29394f;
      text-align: center;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .success { color: #4ade80; }
    .error { color: #fca5a5; }
    .hint {
      color: #aab8ca;
      font-size: 12px;
      text-align: center;
      margin-top: 15px;
    }
    #bridgeFrame { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h2>📷 Scanner Absensi</h2>
  <div class="subtitle">Scan QR Code siswa untuk mencatat kehadiran</div>

  <div id="reader"></div>

  <button id="startButton" onclick="startScanner()">▶ MULAI SCAN</button>
  <button id="stopButton" class="stop" onclick="stopScanner()" disabled>
    ■ BERHENTI
  </button>

  <div id="status">Kamera belum dijalankan.</div>
  <div class="hint">Arahkan kamera ke QR Code yang berisi NISN siswa.</div>
</div>

<iframe name="bridgeFrame" id="bridgeFrame"></iframe>

<script>
  // GANTI dengan URL Web App Google Apps Script milik kamu.
  const WEB_APP_URL = "GANTI_DENGAN_URL_WEB_APP/exec";

  // GANTI dengan kunci API yang sama di Script Properties Apps Script.
  const API_KEY = "GANTI_DENGAN_KUNCI_API";

  let scanner = null;
  let isRunning = false;
  let isSending = false;
  let lastScanned = "";

  function showStatus(message, type = "") {
    const el = document.getElementById("status");
    el.className = type;
    el.textContent = message;
  }

  async function startScanner() {
    if (isRunning) return;

    if (!window.isSecureContext) {
      showStatus("Kamera membutuhkan halaman HTTPS.", "error");
      return;
    }

    try {
      scanner = new Html5Qrcode("reader");

      const cameras = await Html5Qrcode.getCameras();
      if (!cameras || cameras.length === 0) {
        throw new Error("Kamera tidak ditemukan.");
      }

      const backCamera =
        cameras.find(c => /back|rear|environment|belakang/i.test(c.label)) ||
        cameras[cameras.length - 1];

      await scanner.start(
        backCamera.id,
        { fps: 10, qrbox: { width: 230, height: 230 } },
        onScanSuccess,
        () => {}
      );

      isRunning = true;
      document.getElementById("startButton").disabled = true;
      document.getElementById("stopButton").disabled = false;
      showStatus("Kamera aktif. Silakan scan QR Code.");
    } catch (error) {
      showStatus("Gagal membuka kamera: " + error.message, "error");
    }
  }

  async function stopScanner() {
    if (!scanner || !isRunning) return;

    try {
      await scanner.stop();
      await scanner.clear();
    } catch (error) {
      console.error(error);
    }

    scanner = null;
    isRunning = false;
    document.getElementById("startButton").disabled = false;
    document.getElementById("stopButton").disabled = true;
    showStatus("Scanner dihentikan.");
  }

  function onScanSuccess(decodedText) {
    if (isSending || decodedText === lastScanned) return;

    const nisn = decodedText.trim();
    if (!nisn) return;

    lastScanned = nisn;
    isSending = true;

    showStatus("QR terbaca. Mengirim data ke server...", "");

    sendAttendance(nisn);
  }

  function sendAttendance(nisn) {
    if (WEB_APP_URL.includes("GANTI_DENGAN")) {
      showStatus("Masukkan URL Web App terlebih dahulu.", "error");
      isSending = false;
      return;
    }

    const form = document.createElement("form");
    form.method = "POST";
    form.action = WEB_APP_URL;
    form.target = "bridgeFrame";

    const fields = {
      action: "scan",
      nisn: nisn,
      apiKey: API_KEY
    };

    Object.entries(fields).forEach(([name, value]) => {
      const input = document.createElement("input");
      input.type = "hidden";
      input.name = name;
      input.value = value;
      form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();
    form.remove();

    // Tunggu balasan dari Apps Script melalui iframe.
    setTimeout(() => {
      if (isSending) {
        isSending = false;
        showStatus("Belum menerima balasan server. Periksa koneksi dan konfigurasi.", "error");
      }
    }, 12000);
  }

  window.addEventListener("message", event => {
    if (event.origin !== new URL(WEB_APP_URL).origin) return;

    const data = event.data;
    if (!data || data.type !== "ABSENSI_RESULT") return;

    isSending = false;

    if (data.success) {
      showStatus(data.message || "Absensi berhasil dicatat.", "success");
    } else {
      showStatus(data.message || "Absensi gagal dicatat.", "error");
    }

    // Izinkan scan berikutnya setelah beberapa saat.
    setTimeout(() => {
      lastScanned = "";
    }, 3000);
  });
</script>

</body>
</html>
