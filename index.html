
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner Absensi QR</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #edf5f1;
      font-family: Arial, sans-serif;
      color: #183b30;
    }

    .card {
      max-width: 600px;
      margin: 20px auto;
      padding: 24px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 10px 30px #123b2912;
      text-align: center;
    }

    h2 { margin-top: 0; }

    #reader {
      width: 100%;
      min-height: 220px;
      margin: 18px auto;
      overflow: hidden;
      border-radius: 15px;
    }

    button, select {
      width: 100%;
      min-height: 48px;
      margin-top: 10px;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      font-size: 15px;
    }

    button {
      color: white;
      background: #087b61;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      color: #075744;
      background: #e5f3ed;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    select {
      border: 1px solid #dce8e2;
      background: white;
    }

    #message {
      min-height: 24px;
      margin-top: 15px;
      font-size: 13px;
      line-height: 1.5;
    }

    .hint { color: #80938a; font-size: 13px; }
  </style>
</head>

<body>
  <main class="card">
    <h2>Scanner Kehadiran QR</h2>
    <p class="hint">
      Arahkan kamera ke QR Code siswa. Pastikan QR berisi NISN.
    </p>

    <select id="cameraSelect" disabled>
      <option value="">Kamera akan terdeteksi setelah izin diberikan</option>
    </select>

    <div id="reader"></div>

    <button id="startButton" onclick="startCamera()">
      Mulai Kamera
    </button>

    <button id="stopButton" class="secondary" onclick="stopCamera()" disabled>
      Hentikan Kamera
    </button>

    <p id="message">Tekan Mulai Kamera untuk meminta izin kamera.</p>
  </main>

  <script>
    let scanner = null;
    let running = false;
    let processing = false;
    let cameras = [];

    const message = document.getElementById("message");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");
    const cameraSelect = document.getElementById("cameraSelect");

    const params = new URLSearchParams(location.search);
    const returnOrigin = params.get("returnOrigin") || "";

    function setMessage(text, error = false) {
      message.textContent = text;
      message.style.color = error ? "#c34d4d" : "#087b61";
    }

    function validReturnOrigin(origin) {
      try {
        const u = new URL(origin);

        return (
          u.protocol === "https:" &&
          (
            u.hostname === "script.google.com" ||
            u.hostname.endsWith(".googleusercontent.com")
          )
        );
      } catch (e) {
        return false;
      }
    }

    async function startCamera() {
      if (running) return;

      if (!window.isSecureContext) {
        setMessage(
          "Kamera memerlukan HTTPS. Buka scanner melalui alamat GitHub Pages HTTPS.",
          true
        );
        return;
      }

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        setMessage(
          "Browser tidak mendukung akses kamera. Gunakan Chrome terbaru.",
          true
        );
        return;
      }

      startButton.disabled = true;
      setMessage("Meminta izin kamera...");

      try {
        // Meminta izin setelah tindakan klik pengguna.
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });

        stream.getTracks().forEach(track => track.stop());

        cameras = await Html5Qrcode.getCameras();

        if (!cameras || !cameras.length) {
          throw new Error("Kamera tidak ditemukan.");
        }

        cameraSelect.innerHTML = "";

        cameras.forEach((camera, index) => {
          const option = document.createElement("option");
          option.value = camera.id;
          option.textContent = camera.label || ("Kamera " + (index + 1));
          cameraSelect.appendChild(option);
        });

        cameraSelect.disabled = false;

        const rearCamera = cameras.find(c =>
          /back|rear|environment|belakang/i.test(c.label)
        );

        const selectedCamera = rearCamera || cameras[0];
        cameraSelect.value = selectedCamera.id;

        await runScanner(selectedCamera.id);

      } catch (error) {
        startButton.disabled = false;

        let explanation = error.message || String(error);

        if (
          error.name === "NotAllowedError" ||
          error.name === "PermissionDeniedError"
        ) {
          explanation =
            "Izin kamera ditolak. Klik ikon gembok di samping alamat situs, buka Setelan situs, ubah Kamera menjadi Izinkan, lalu muat ulang halaman.";
        } else if (error.name === "NotFoundError") {
          explanation = "Kamera tidak ditemukan pada perangkat ini.";
        } else if (error.name === "NotReadableError") {
          explanation = "Kamera sedang digunakan aplikasi lain. Tutup aplikasi kamera lain lalu coba lagi.";
        }

        setMessage(explanation, true);
      }
    }

    async function runScanner(cameraId) {
      if (scanner && running) {
        await stopCamera();
      }

      scanner = new Html5Qrcode("reader");

      try {
        await scanner.start(
          cameraId,
          {
            fps: 10,
            qrbox: function(width, height) {
              const size = Math.floor(Math.min(width, height) * 0.72);
              return { width: size, height: size };
            },
            aspectRatio: 1
          },
          onScanSuccess,
          function() {}
        );

        running = true;
        startButton.disabled = true;
        stopButton.disabled = false;
        setMessage("Kamera aktif. Arahkan ke QR Code siswa.");

      } catch (error) {
        running = false;
        startButton.disabled = false;
        stopButton.disabled = true;
        setMessage(
          "Tidak dapat memulai kamera: " + (error.message || error),
          true
        );
      }
    }

    async function onScanSuccess(decodedText) {
      if (processing) return;

      const nisn = String(decodedText || "").trim();

      if (!nisn) return;

      processing = true;
      setMessage("QR terbaca. Mengirim data absensi...");

      try {
        await stopCamera();

        if (!window.opener || window.opener.closed) {
          setMessage(
            "Halaman aplikasi utama tidak ditemukan. Buka scanner dari aplikasi absensi.",
            true
          );
          processing = false;
          return;
        }

        if (!validReturnOrigin(returnOrigin)) {
          setMessage(
            "Alamat aplikasi utama tidak valid. Buka ulang scanner dari aplikasi.",
            true
          );
          processing = false;
          return;
        }

        window.opener.postMessage(
          {
            type: "QR_ATTENDANCE",
            studentId: nisn
          },
          returnOrigin
        );

        setMessage("QR berhasil dikirim. Periksa hasil absensi pada aplikasi utama.");
        setTimeout(() => {
          processing = false;
        }, 2500);

      } catch (error) {
        setMessage(error.message || String(error), true);
        processing = false;
      }
    }

    async function stopCamera() {
      if (scanner && running) {
        try {
          await scanner.stop();
          await scanner.clear();
        } catch (error) {
          console.warn(error);
        }
      }

      running = false;
      startButton.disabled = false;
      stopButton.disabled = true;
    }

    cameraSelect.addEventListener("change", async function() {
      if (!cameraSelect.value) return;

      const selected = cameraSelect.value;

      if (running) {
        await stopCamera();
      }

      await runScanner(selected);
    });

    window.addEventListener("beforeunload", function() {
      if (scanner && running) {
        scanner.stop().catch(() => {});
      }
    });
  </script>
</body>
</html>
